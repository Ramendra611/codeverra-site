baseURL = "https://learn.codeverra.com/"
relativeURLs = true
canonifyURLs = true
languageCode = "en-us"
title = "codeverra"
theme = "PaperMod"

enableRobotsTXT = true

[pagination]
  pagerSize = 9

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "Ram"
  description = "Learn about learning Python, DSA, Machine Learning, and AI with clarity."
  defaultTheme = "auto"
  disableThemeToggle = false
  showToc = true
  tocOpen = true
  ShowReadingTime = true
  enableGitInfo = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowPostMeta = true
  ShowLastMod = true

  [params.label]
    text = "codeverra"
    icon = "images/CODEVERRA.jpg"
    iconHeight = 32
    link = "/"

enableGitInfo = false

[frontmatter]
  date = [':filename', ':default']
  lastmod = ["lastmod", ":git", ":fileModTime"]
  publishDate = [':filename', ':default']

[[menu.main]]
  name = "Home"
  url = "https://codeverra.com/"
  weight = 1

[[menu.main]]
  name = "Courses"
  url = "https://codeverra.com/s/store"
  weight = 2

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 4


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false






