{{- define "main" }}

<header class="page-header">
    <h1>{{- (printf "%s&nbsp;" .Title ) | htmlUnescape -}}
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
</header>

<div id="searchbox">
    <input id="searchInput" autofocus placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
        aria-label="search" type="search" autocomplete="off" maxlength="64">
    <ul id="searchResults" aria-label="search results"></ul>
</div>

<script>
// Pre-fill search input from ?q= URL param
(function () {
    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q) {
        var inp = document.getElementById('searchInput');
        if (inp) {
            inp.value = q;
            // Trigger Fuse.js search after the index loads — poll briefly
            var attempts = 0;
            var poll = setInterval(function () {
                inp.dispatchEvent(new KeyboardEvent('keyup', { bubbles: true }));
                attempts++;
                if (attempts > 20) clearInterval(poll);
                // Stop polling once results appear
                if (document.getElementById('searchResults').children.length > 0) clearInterval(poll);
            }, 200);
        }
    }
})();
</script>

{{- end }}{{/* end main */}}
